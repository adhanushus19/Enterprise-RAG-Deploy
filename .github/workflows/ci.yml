name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev build-essential

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r frontend/requirements.txt

    - name: Run Linter (Flake8)
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 backend/app tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 backend/app tests/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Run Pytest Suite with Coverage
      env:
        OPENAI_API_KEY: "mock-api-key"
      run: |
        pytest --cov=backend/app --cov-fail-under=80 --cov-report=term-missing tests/
